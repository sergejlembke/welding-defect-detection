defaults:
  - model: resnet50_finetune
  - dataset: welding_default
  - _self_

epochs: 15
seed: 42
device: "auto"

mlflow:
  tracking_uri: "sqlite:///outputs/mlflow.db"
  experiment_name: "Welding_Defect_Inspection"

hydra:
  run:
    dir: outputs/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}