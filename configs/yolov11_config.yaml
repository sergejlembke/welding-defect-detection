defaults:
  - _self_

epochs: 200
imgsz: 1024
batch_size: 64     # Split onto 4 GPUs (16 per GPU)
device: [0, 1, 2, 3] # Uses all 4 GPUs via DDP

model:
  name: "yolo11x.pt"

dataset:
  data_yaml: "data/raw_welding_dataset/The Welding Defect Dataset - v2/The Welding Defect Dataset - v2/data.yaml"

mlflow:
  tracking_uri: "sqlite:///outputs/mlflow.db"
  experiment_name: "Welding_Defect_Inspection"

hydra:
  run:
    dir: outputs/logs
  output_subdir: null